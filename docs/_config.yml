title: Korev
description: Run Claude Code and Codex in parallel, one git worktree per task.
url: https://thiagosalvatore.github.io
baseurl: /korev

remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
    values:
      layout: default

color_scheme: dark
search_enabled: true
heading_anchors: true

aux_links:
  GitHub: https://github.com/thiagosalvatore/korev
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/thiagosalvatore/korev
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

relative_links:
  enabled: true
  collections: false
